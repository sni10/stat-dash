{# One TailAdmin metric card. Params: label, value, hint, change (fraction or None), change_hint #}
{% load dash %}
<div class="rounded-2xl border border-gray-200 bg-white p-5 md:p-6 dark:border-gray-800 dark:bg-white/3">
  <span class="text-sm text-gray-500 dark:text-gray-400">{{ label }}</span>
  <div class="mt-2 flex flex-wrap items-end justify-between gap-2">
    <h4 class="text-title-sm font-bold whitespace-nowrap text-gray-800 dark:text-white/90">{{ value }}</h4>
    {% if change is not None %}
      <span title="{{ change_hint }}" class="inline-flex h-6 w-fit shrink-0 items-center gap-1 rounded-lg px-2.5 py-0.5 text-sm font-medium whitespace-nowrap {% if change >= 0 %}bg-green-50 text-green-600 dark:bg-green-500/15 dark:text-green-500{% else %}bg-red-50 text-red-600 dark:bg-red-500/15 dark:text-red-500{% endif %}">
        {{ change|pct }}
      </span>
    {% endif %}
  </div>
  {% if hint %}<p class="mt-2 text-xs text-gray-400 dark:text-gray-500">{{ hint }}</p>{% endif %}
</div>
