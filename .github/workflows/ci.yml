# Push and pull request to main: commit messages (Conventional Commits) + tests.
# Push to main only, after green tests: semantic release (tag vX.Y.Z + GitHub Release, if commits warrant one)
# and the image ghcr.io/<owner>/<repo>:<commit sha> (+ :vX.Y.Z when a release was made).
# The stack runs locally (compose.yaml); nothing is deployed from CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # first push of a branch has no "before": lint just the pushed commit
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then FROM="$TO~1"; fi
          # the root commit has no parent: lint it alone
          if ! git rev-parse --verify --quiet "$FROM" >/dev/null; then
            git log -1 --format=%B "$TO" | npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21 \
              commitlint --verbose
            exit
          fi
          npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21 \
            commitlint --from "$FROM" --to "$TO" --verbose

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: stat_dash
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d stat_dash"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-used-for-tests-0123456789abcdefghij
      DJANGO_DEBUG: 'true'
      DB_NAME: stat_dash
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests with coverage (JUnit report -> reports/junit.xml)
        env:
          TEST_REPORTS_DIR: reports
        run: uv run coverage run manage.py test
      - name: Coverage reports and summary
        if: always()
        run: |
          uv run coverage xml -o reports/coverage.xml
          uv run coverage json -o reports/coverage.json
          uv run coverage html -d reports/coverage-html
          { echo '### Coverage'; uv run coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: reports/
          retention-days: 14

  # README badges "coverage" and "tests": shields.io endpoint JSON, force-pushed to the orphan branch `badges`
  # (main only; CI does not run on that branch). No external service, no extra token.
  badges:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: reports
      - name: Badge JSON from the coverage and JUnit reports
        run: |
          mkdir badges
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          def badge(name, label, message, color):
              with open(f'badges/{name}.json', 'w') as f:
                  json.dump({'schemaVersion': 1, 'label': label, 'message': message, 'color': color}, f)

          pct = json.load(open('reports/coverage.json'))['totals']['percent_covered']
          color = next(c for limit, c in ((90, 'brightgreen'), (80, 'green'), (70, 'yellowgreen'), (60, 'yellow'),
                                          (0, 'red')) if pct >= limit)
          badge('coverage', 'coverage', f'{pct:.0f}%', color)

          root = ET.parse('reports/junit.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root)
          total = sum(int(s.get('tests', 0)) for s in suites)
          bad = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          badge('tests', 'tests', f'{total - bad} passed' if not bad else f'{bad} failed', 'red' if bad else 'brightgreen')
          PY
          cat badges/*.json
      - name: Push to the badges branch
        working-directory: badges
        run: |
          git init -q -b badges
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m 'chore: badges'
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges

  # The dashboard CSS and vendored JS are committed (no Node at runtime): they must match a fresh build
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Committed build is up to date
        run: git diff --exit-code -- dashboard/static || { echo '::error::Run `npm run build` in frontend/ and commit dashboard/static'; exit 1; }

  release:
    if: github.event_name == 'push'
    needs: [commits, test, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tag + GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}  # a branch, not a detached HEAD: semantic release needs it
          fetch-depth: 0
      - name: Release exactly the tested commit, even if main moved on meanwhile
        run: git reset --hard ${{ github.sha }}
      - id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false  # version lives in git tags, nothing is committed back to main
          tag: true
          push: true
          changelog: false
          vcs_release: true

  image:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ needs.release.outputs.released == 'true' && format('ghcr.io/{0}:v{1}', github.repository, needs.release.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
