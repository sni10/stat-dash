# Production stack of stat-dash (server: ~/stat-dash of the deploy user). Values come from .env next to this file
# (see .env.production.example). IMAGE_TAG = commit SHA of the image built by CI, written by deploy/deploy.sh.
#
# Public entry: caddy on 80/443 with HTTPS for SITE_HOST (an sslip.io name of the server's IP, no domain needed),
# config deploy/Caddyfile. The web port itself is published only on WEB_BIND, a private address (the Tailscale IP or
# 127.0.0.1): the admin is reachable there and not through caddy. Never publish the web port on 0.0.0.0: plain HTTP
# would send the login password in clear text, and Docker opens published ports past ufw.
# Sized for a small VPS (1 CPU, ~1.6 GB RAM shared with other stacks): Postgres with small buffers, 2 gunicorn workers.
x-logging: &logging
  driver: local
  options: { max-size: "20m", max-file: "5" }

x-app: &app
  image: ghcr.io/sni10/stat-dash:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    TZ: Europe/Kyiv
  depends_on:
    db:
      condition: service_healthy
  logging: *logging

services:
  db:
    image: postgres:17
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *app
    # The server's one vCPU is shared with other projects: two workers are plenty for one user
    command: ["gunicorn", "config.wsgi", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "60",
              "--access-logfile", "-"]
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST, e.g. 203-0-113-10.sslip.io}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # certificates: keep them, Let's Encrypt has rate limits
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

  scheduler:
    <<: *app
    command: ["sh", "./docker/scheduler.sh"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      TZ: Europe/Kyiv
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
